name: Build FAMITO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAMITO Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check ZIP
        run: |
          echo "Files in repository:"
          ls -lah
          echo ""
          echo "Checking FAMITO ZIP:"
          unzip -l FAMITO_build_fixed.zip | head -40

      - name: Extract FAMITO project
        run: |
          rm -rf famito
          mkdir -p famito
          unzip -q FAMITO_build_fixed.zip -d famito

          echo "Extracted project:"
          find famito -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle project
        working-directory: famito
        run: |
          echo "Project files:"
          ls -lah
          echo ""
          echo "settings.gradle.kts:"
          cat settings.gradle.kts
          echo ""
          echo "app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Build FAMITO Debug APK
        working-directory: famito
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace --info

      - name: Find APK
        working-directory: famito
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload FAMITO APK
        uses: actions/upload-artifact@v4
        with:
          name: FAMITO-APK
          path: famito/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
